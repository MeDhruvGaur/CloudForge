# ── Global settings shared across all subcharts ──────────────────────
global:
  imageRegistry: ghcr.io
  imageRepository: your-org/cloudforge
  imageTag: latest
  imagePullPolicy: Always

  environment: production
  domainBase: ecommerce.com

  # Kubernetes namespace
  namespace: production

# ── Replica counts per service ────────────────────────────────────────
replicaCount: 2
canary:
  enabled: false

# ── Service-specific overrides ────────────────────────────────────────
frontend:
  enabled: true
  port: 3000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

apiGateway:
  enabled: true
  port: 8080
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

productService:
  enabled: true
  port: 8080
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 400m
      memory: 512Mi

orderService:
  enabled: true
  port: 8080
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 400m
      memory: 512Mi

userService:
  enabled: true
  port: 8080
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 400m
      memory: 512Mi

paymentService:
  enabled: true
  port: 8080
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── Ingress ───────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: app.ecommerce.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
    - host: api.ecommerce.com
      paths:
        - path: /api/products
          pathType: Prefix
          service: api-gateway
        - path: /api/orders
          pathType: Prefix
          service: api-gateway
        - path: /api/users
          pathType: Prefix
          service: api-gateway
        - path: /api/payments
          pathType: Prefix
          service: api-gateway
  tls:
    - secretName: ecommerce-tls
      hosts:
        - app.ecommerce.com
        - api.ecommerce.com

# ── Horizontal Pod Autoscaler ─────────────────────────────────────────
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# ── Pod Disruption Budget ─────────────────────────────────────────────
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ── Security context (non-root, read-only FS) ─────────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# ── Probes ────────────────────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 5
  failureThreshold: 3

# ── Prometheus ServiceMonitor ─────────────────────────────────────────
serviceMonitor:
  enabled: true
  namespace: monitoring
  interval: 15s
  scrapeTimeout: 10s

# ── Pod anti-affinity (spread pods across nodes) ─────────────────────
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ecommerce
          topologyKey: kubernetes.io/hostname

